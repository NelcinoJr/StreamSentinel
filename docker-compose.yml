services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.streamsentinel.local`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.entrypoints=web
    restart: unless-stopped

  # Fila rápida — Beanstalkd/Redis no mundo PHP
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # MySQL local do projeto (não é o mysql-dev ContaÁgil — MCP sem acesso)
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: streamsentinel
      MYSQL_USER: streamsentinel
      MYSQL_PASSWORD: streamsentinel
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # API HTTP — PHP-FPM + Zend atrás do Traefik
  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: mysql+asyncmy://streamsentinel:streamsentinel@mysql:3306/streamsentinel
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.streamsentinel.local`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8000
    restart: unless-stopped

  # Worker CLI — script em loop (php public/index.php worker)
  # Mesma imagem da API; só muda o comando de entrada
  worker:
    build: .
    command: ["python", "-m", "app.workers.transaction_ingest_worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: mysql+asyncmy://streamsentinel:streamsentinel@mysql:3306/streamsentinel
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
